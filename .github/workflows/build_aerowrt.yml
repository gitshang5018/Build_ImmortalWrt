name: Build AeroWrt Plugin

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布到 GitHub Releases'
        required: false
        type: boolean
        default: true
  push:
    paths:
      - 'package/services/aerowrt/**'
      - '.github/workflows/build_aerowrt.yml'
      - 'wrt_core/patches/tests/test_aerowrt.sh'

permissions:
  contents: write
  actions: write

jobs:
  build-aerowrt:
    name: Build AeroWrt Standalone Packages
    runs-on: ubuntu-24.04

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置时区与环境变量
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          BUILD_TIME=$(date +"%Y%m%d_%H%M%S")
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "PKG_VERSION=1.0.0" >> $GITHUB_ENV

      - name: 配置 Go 运行环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: package/services/aerowrt/src/go.mod

      - name: 运行单元测试与包结构验证
        run: |
          chmod +x wrt_core/patches/tests/test_aerowrt.sh
          ./wrt_core/patches/tests/test_aerowrt.sh

      - name: 多架构交叉编译与 OpenWrt IPK 打包
        run: |
          mkdir -p bin/packages
          SRC_DIR="package/services/aerowrt"

          # 架构定义矩阵: 名称:GOOS:GOARCH:GOARM/GOMIPS:IPK_ARCH
          TARGETS=(
            "x86_64:linux:amd64::x86_64"
            "aarch64:linux:arm64::aarch64_cortex-a53"
            "mipsle:linux:mipsle:softfloat:mipsel_24kc"
            "armv7:linux:arm:7:arm_cortex-a7_neon-vfpv4"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS=':' read -r NAME GOOS GOARCH EXTRA_FLAG IPK_ARCH <<< "$TARGET"
            echo "=================================================="
            echo ">>> 正在编译架构: $NAME ($GOARCH) -> $IPK_ARCH"
            echo "=================================================="

            BIN_OUT="/tmp/build_${NAME}/aerowrt"
            mkdir -p "/tmp/build_${NAME}"

            # 1. 跨平台静态编译 Go 单二进制
            pushd "$SRC_DIR/src" >/dev/null
            if [ "$GOARCH" == "mipsle" ]; then
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH GOMIPS=$EXTRA_FLAG go build -ldflags="-s -w" -o "$BIN_OUT" main.go
            elif [ "$GOARCH" == "arm" ]; then
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH GOARM=$EXTRA_FLAG go build -ldflags="-s -w" -o "$BIN_OUT" main.go
            else
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o "$BIN_OUT" main.go
            fi
            popd >/dev/null

            # 2. 组装 OpenWrt 根目录结构
            WORK_DIR="/tmp/ipk_${NAME}"
            rm -rf "$WORK_DIR"
            mkdir -p "$WORK_DIR/data/usr/bin"
            mkdir -p "$WORK_DIR/data/etc/init.d"
            mkdir -p "$WORK_DIR/data/etc/config"
            mkdir -p "$WORK_DIR/control"

            cp "$BIN_OUT" "$WORK_DIR/data/usr/bin/aerowrt"
            chmod 755 "$WORK_DIR/data/usr/bin/aerowrt"

            cp "$SRC_DIR/files/aerowrt.init" "$WORK_DIR/data/etc/init.d/aerowrt"
            chmod 755 "$WORK_DIR/data/etc/init.d/aerowrt"

            cp "$SRC_DIR/files/aerowrt.config" "$WORK_DIR/data/etc/config/aerowrt"

            # 3. 构造 control 控制信息
            {
              echo "Package: aerowrt"
              echo "Version: ${PKG_VERSION}-1"
              echo "Depends: libc, ca-bundle, sing-box, kmod-tun, mosdns"
              echo "Section: net"
              echo "Category: Network"
              echo "Title: AeroWrt Modern Transparent Proxy Suite for OpenWrt"
              echo "Maintainer: AeroWrt Developers"
              echo "Architecture: ${IPK_ARCH}"
              echo "Description: A modern, lightweight, standalone WebUI transparent proxy suite for OpenWrt with Sing-box core, strategy groups, chain proxy, and MosDNS integration."
            } > "$WORK_DIR/control/control"

            # 4. 编写 postinst 与 prerm 自动化启停服务脚本
            {
              echo '#!/bin/sh'
              echo '[ -n "$IPKG_INSTROOT" ] || {'
              echo '    /etc/init.d/aerowrt enable'
              echo '    /etc/init.d/aerowrt restart'
              echo '}'
              echo 'exit 0'
            } > "$WORK_DIR/control/postinst"
            chmod 755 "$WORK_DIR/control/postinst"

            {
              echo '#!/bin/sh'
              echo '[ -n "$IPKG_INSTROOT" ] || {'
              echo '    /etc/init.d/aerowrt stop'
              echo '    /etc/init.d/aerowrt disable'
              echo '}'
              echo 'exit 0'
            } > "$WORK_DIR/control/prerm"
            chmod 755 "$WORK_DIR/control/prerm"

            # 5. 生成 data.tar.gz 与 control.tar.gz
            tar -czf "$WORK_DIR/data.tar.gz" -C "$WORK_DIR/data" .
            tar -czf "$WORK_DIR/control.tar.gz" -C "$WORK_DIR/control" .
            echo "2.0" > "$WORK_DIR/debian-binary"

            # 6. 生成标准 IPK 安装包
            IPK_NAME="aerowrt_${PKG_VERSION}-1_${IPK_ARCH}.ipk"
            tar -czf "bin/packages/$IPK_NAME" -C "$WORK_DIR" debian-binary control.tar.gz data.tar.gz

            # 7. 生成独立免包解压版 (Standalone Tarball)
            STANDALONE_NAME="aerowrt_${PKG_VERSION}_${NAME}_standalone.tar.gz"
            tar -czf "bin/packages/$STANDALONE_NAME" -C "$WORK_DIR/data" .
          done

          echo "=== 所有架构构建与打包完成 ==="
          ls -lh bin/packages/

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: aerowrt-packages
          path: bin/packages/

      - name: 发布至 GitHub Releases
        if: ${{ inputs.create_release == true || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "aerowrt-${{ env.BUILD_TIME }}"
          name: "AeroWrt 现代透明代理套件 (v${{ env.PKG_VERSION }})"
          body: |
            ### 🚀 AeroWrt (OpenWrt 现代透明代理管理套件)

            专为 OpenWrt 路由器打造的轻量级、高颜值现代独立 WebUI 透明网关套件，支持自适应系统主题、策略组调度、链式代理与本地 MosDNS 联动。

            ---

            #### 📦 架构适配指南：
            * **x86_64**：`aerowrt_${{ env.PKG_VERSION }}-1_x86_64.ipk`（软路由、虚拟机、通用 PC）
            * **aarch64**：`aerowrt_${{ env.PKG_VERSION }}-1_aarch64_cortex-a53.ipk`（京东云 亚瑟/雅典娜、红米 AX6000、斐讯 N1 等）
            * **mipsel_24kc**：`aerowrt_${{ env.PKG_VERSION }}-1_mipsel_24kc.ipk`（歌华链 GHL-R-001、MT7621 路由）
            * **arm_cortex-a7**：`aerowrt_${{ env.PKG_VERSION }}-1_arm_cortex-a7_neon-vfpv4.ipk`（ARM 32位路由）

            ---

            #### 🛠️ 安装与使用方法：

            ##### 方式一：通过 OPKG 安装（推荐）
            上传对应架构的 `.ipk` 到路由器的 `/tmp/` 目录，执行命令：
            ```bash
            opkg update
            opkg install /tmp/aerowrt_${{ env.PKG_VERSION }}-1_<你的架构>.ipk
            ```
            安装完成后服务会自动启用并启动！

            ##### 方式二：免 opkg 纯解压安装（适用于包管理器源不可用环境）
            上传对应的 `_standalone.tar.gz` 到路由器根目录 `/`，执行：
            ```bash
            tar -zxvf /tmp/aerowrt_${{ env.PKG_VERSION }}_<架构>_standalone.tar.gz -C /
            /etc/init.d/aerowrt enable
            /etc/init.d/aerowrt start
            ```

            ---

            #### 🌐 打开管理后台：
            在浏览器访问：`http://路由器IP:9099`（例如 `http://10.10.10.1:9099`）即可进入 WebUI 仪表盘进行节点管理与测速！
          files: |
            bin/packages/aerowrt_*.ipk
            bin/packages/aerowrt_*.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
